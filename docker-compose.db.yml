services:
  db:
    image: postgres:16-alpine
    container_name: uraiworkflow-db
    environment:
      POSTGRES_USER: vcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcc}
      POSTGRES_DB: vcc
    ports:
      - "5432:5432"
    volumes:
      - vcc-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcc -d vcc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  vcc-pg:
